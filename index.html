<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>게임 허브</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="app">
    <header id="hub-header">
      <div id="hub-title">게임 허브</div>
      <div id="hub-subtitle">여기서 만든 게임들을 한 곳에서</div>
    </header>

    <main id="game-grid">
      <a class="game-card" href="interrogation-room/">
        <div class="game-card-badge">AI · 서사</div>
        <div class="game-card-title">취조실 감독관</div>
        <div class="game-card-desc">AI 심문관이 AI 용의자를 심문하는 걸 지켜보며, 매 턴 전술을 지시해 진실을 밝혀내는 게임.</div>
      </a>

      <a class="game-card" href="golem-code/">
        <div class="game-card-badge">AI · 코딩</div>
        <div class="game-card-title">골렘 코드</div>
        <div class="game-card-desc">마법 로봇에게 명령서(코드)를 새겨 AI가 만든 던전을 자율적으로 돌파시키는 게임.</div>
      </a>

      <a class="game-card" href="fighter/">
        <div class="game-card-badge">대전 격투 · 온라인</div>
        <div class="game-card-title">아레나 듀얼</div>
        <div class="game-card-desc">친구와 방 코드로 1:1 온라인 대전을 하거나, 3단계 난이도의 CPU와 싸우는 2D 격투 게임.</div>
      </a>
    </main>

    <footer id="hub-footer">개인 프로젝트 모음 · 계속 추가될 예정</footer>
  </div>
</body>
</html>
