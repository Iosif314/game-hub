<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>감정 전당포 · 시험판</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri@2.39.3/dist/galmuri.css" />
  <link rel="stylesheet" href="css/style.css?v=20261006l" />
  <script type="importmap">
    { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
  </script>
</head>
<body>
  <div id="stage">
    <canvas id="view"></canvas>
    <canvas id="view3d" class="hidden"></canvas>
    <div id="hud"></div>
    <div id="tip"></div>
    <div id="dialog" class="hidden">
      <div class="name"></div>
      <div class="text"></div>
      <div class="choices"></div>
    </div>
    <div id="panel" class="hidden"></div>
    <div id="label-tip" class="hidden"></div>
    <div id="version"></div>
    <div id="overlay">
      <h1>감정 전당포</h1>
      <div class="sub">시험판 · 사흘</div>
      <div class="warn">피와 비명이 나오는 잔혹한 장면이 있습니다. 소리를 켜고 하세요.</div>
      <table class="keys">
        <tr><td>대화 넘기기</td><td>클릭 · Space</td></tr>
        <tr><td>이동 (추출실)</td><td>← → 또는 A D</td></tr>
        <tr><td>상호작용</td><td>E</td></tr>
        <tr><td>발전기 돌리기</td><td>발전기 앞에서 E 또는 Space를 누르고 있기</td></tr>
        <tr><td>라벨 보기</td><td>저장고에서 병에 마우스 올리기</td></tr>
      </table>
      <div class="hint">클릭해서 시작</div>
    </div>
  </div>
  <script>
    // GitHub Pages lets browsers keep this page for up to ten minutes, and a reload does not always
    // fetch it again. Ask the server directly which build is current, and if it is newer than this
    // one, load that build instead (once per build, so it can never loop).
    (function () {
      var build = "20261006l";
      fetch(location.pathname + "?check=" + Date.now(), { cache: "no-store" })
        .then(function (r) { return r.text(); })
        .then(function (html) {
          var m = html.match(/main\.js\?v=([0-9a-z]+)/);
          if (!m || m[1] === build) return;
          try {
            if (sessionStorage.getItem("loaded-" + m[1])) return;
            sessionStorage.setItem("loaded-" + m[1], "1");
          } catch (e) {}
          location.replace(location.pathname + "?v=" + m[1]);
        })
        .catch(function () {});
    })();
  </script>
  <script type="module" src="js/main.js?v=20261006l"></script>
</body>
</html>
