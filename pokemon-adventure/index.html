<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Monster Trail</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="app">
    <div id="hud">
      <div id="hud-left">
        <span id="hud-gold">골드 0</span>
      </div>
      <div id="hud-party"></div>
    </div>

    <div id="game-area">
      <canvas id="world-canvas"></canvas>

      <div id="dialogue-box" class="hidden">
        <div id="dialogue-name"></div>
        <div id="dialogue-text"></div>
        <button id="dialogue-next">▼ 다음</button>
      </div>

      <div id="battle-screen" class="hidden">
        <div class="battle-card" id="enemy-card">
          <div class="battle-card-info">
            <div class="battle-card-name"><span id="enemy-name"></span> <span id="enemy-level"></span></div>
            <div class="passive-tags" id="enemy-passives"></div>
            <div class="hp-bar"><div class="hp-bar-fill" id="enemy-hp-fill"></div></div>
            <div class="hp-text" id="enemy-hp-text"></div>
          </div>
          <div class="battle-sprite" id="enemy-sprite"></div>
        </div>

        <div class="battle-card" id="player-card">
          <div class="battle-sprite" id="player-sprite"></div>
          <div class="battle-card-info">
            <div class="battle-card-name">
              <span id="player-mon-name"></span> <span id="player-mon-level"></span>
              <span id="player-block" class="block-badge hidden">🛡0</span>
            </div>
            <div class="passive-tags" id="player-passives"></div>
            <div class="hp-bar"><div class="hp-bar-fill" id="player-hp-fill"></div></div>
            <div class="hp-text" id="player-hp-text"></div>
          </div>
        </div>

        <div id="battle-log"></div>

        <div id="battle-bottom">
          <div id="battle-hand-row">
            <div id="battle-energy">⚡ 0/0</div>
            <div id="battle-hand"></div>
            <button id="end-turn-btn" class="battle-action-btn end-turn">턴 종료</button>
          </div>
          <div id="battle-actions"></div>
        </div>
      </div>

      <div id="overlay">
        <div id="overlay-box">
          <h1 id="overlay-title">Monster Trail</h1>
          <p id="overlay-message">함께할 첫 몬스터를 선택하세요.</p>
          <div id="starter-choices"></div>
        </div>
      </div>

      <div id="deck-editor" class="hidden">
        <div id="deck-editor-box">
          <h2 id="deck-editor-title"></h2>
          <div id="deck-editor-xp">
            <div id="deck-editor-xp-text"></div>
            <div class="xp-bar"><div class="xp-bar-fill" id="deck-editor-xp-fill"></div></div>
          </div>
          <div id="deck-editor-total"></div>
          <div id="deck-editor-rows"></div>
          <div id="deck-editor-footer">
            <button id="deck-editor-release">놓아주기</button>
            <button id="deck-editor-close">닫기</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
